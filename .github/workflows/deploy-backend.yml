name: Deploy Backend to VPS

on:
  push:
    branches:
      - production

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/ticketgo-backend:latest

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            # 1. Kéo ảnh Docker mới nhất từ Docker Hub về VPS
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/ticketgo-backend:latest
            
            # 2. Di chuyển vào thư mục chứa docker-compose trên VPS
            cd /app/ticketgo/docker/backend
            
            # 3. Cập nhật dịch vụ backend với ảnh Docker mới
            docker compose up -d --no-deps backend
            
            # 4. Thực thi cập nhật cơ sở dữ liệu với Prisma Migration
            docker exec ticketgo-backend npx prisma migrate deploy
            
            # 5. Dọn dẹp tài nguyên và các image cũ để tối ưu bộ nhớ ổ cứng VPS
            docker image prune -f
